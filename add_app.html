<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>إضافة تطبيق جديد</title>
  <style>
    body {
      font-family: "Tahoma";
      background-color: #f5f5f5;
      margin: 40px;
    }
    form {
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      background-color: #007bff;
      color: white;
      cursor: pointer;
      border: none;
    }
    button:hover {
      background-color: #0056b3;
    }
    .error {
      color: red;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <h2 style="text-align:center;">إضافة تطبيق جديد</h2>

  <form id="appForm">
    <label>اسم التطبيق:</label>
    <input type="text" id="appName" name="appName" required>

    <label>الشركة المصنعة :</label>
    <input type="text" id="company" name="company" required>

    <label>الموقع الإلكتروني:</label>
    <input type="url" id="website" name="website" placeholder="https://example.com" required>

    <label>هل التطبيق مجاني؟</label>
    <select id="isFree" name="isFree" required>
      <option value="">اختر</option>
      <option value="نعم">نعم</option>
      <option value="لا">لا</option>
    </select>

    <label>مجال الاستخدام:</label>
    <select id="category" name="category" required>
      <option value="">اختر المجال</option>
      <option value="Robotics">Robotics</option>
      <option value="Education">Education</option>
      <option value="E-Commerce">E-Commerce</option>
      <option value="Other">Other</option>
    </select>

    <div id="errorMessage" class="error"></div>

    <button type="submit">إرسال</button>
  </form>

  <script>
    document.getElementById("appForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const name = document.getElementById("appName").value.trim();
      const company = document.getElementById("company").value.trim();
      const website = document.getElementById("website").value.trim();
      const isFree = document.getElementById("isFree").value;
      const category = document.getElementById("category").value;
      const errorMessage = document.getElementById("errorMessage");

      errorMessage.textContent = "";

      const nameRegex = /^[A-Za-z]+$/;
      if (!nameRegex.test(name)) {
        errorMessage.textContent = "❌ اسم التطبيق يجب أن يحتوي على أحرف إنجليزية فقط بدون فراغات.";
        return;
      }

      const companyRegex = /^[A-Za-z ]+$/;
      if (!companyRegex.test(company)) {
        errorMessage.textContent = "❌ اسم الشركة يجب أن يحتوي على أحرف إنجليزية فقط.";
        return;
      }

      try {
        new URL(website);
      } catch {
        errorMessage.textContent = "❌ الرجاء إدخال موقع إلكتروني صحيح.";
        return;
      }

      if (!isFree || !category) {
        errorMessage.textContent = "❌ الرجاء اختيار كل القيم المطلوبة.";
        return;
      }

      const appData = { name, company, website, isFree, category };
      localStorage.setItem("newApp", JSON.stringify(appData));

      window.location.href = "app.html";
    });
  </script>

</body>
</html>
